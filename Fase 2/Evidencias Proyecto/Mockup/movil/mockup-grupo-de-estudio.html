<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grupo de Estudio Duoc UC – Mockup</title>
<style>
:root{--bg:#F7F8FA;--out:#DDE3EC;--card:#fff;--ink:#14213D;--mut:#5B6B85;--navy:#0B2A4A;--gold:#FFC72C;--line:#E3E8F0;--ok:#1E8A52;--chip:#EAF0F6;--chipt:#0F3A63;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1930;--out:#060C18;--card:#152341;--ink:#F2F4F8;--mut:#9AA8C2;--line:#223458;--chip:#223458;--chipt:#CFDDEA;--ok:#4CC28A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E1930;--out:#060C18;--card:#152341;--ink:#F2F4F8;--mut:#9AA8C2;--line:#223458;--chip:#223458;--chipt:#CFDDEA;--ok:#4CC28A;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;height:100%;background:var(--out);color:var(--ink);font:15px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
.phone{display:flex;flex-direction:column;height:100%;max-width:420px;margin:0 auto;background:var(--bg);overflow:hidden}
@media(min-width:520px){.phone{height:min(840px,calc(100% - 32px));margin:16px auto;border-radius:28px;box-shadow:0 18px 50px rgba(0,0,0,.28);border:1px solid var(--line)}}
header{background:var(--navy);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px}
header h1{font-size:17px;margin:0;flex:1;font-weight:700}
header button{background:none;border:0;color:var(--gold);font-size:20px;cursor:pointer;padding:2px 6px}
main{flex:1;overflow-y:auto;padding:16px}
nav{display:flex;background:var(--card);border-top:1px solid var(--line)}
nav button{flex:1;border:0;background:none;color:var(--mut);padding:9px 2px 8px;font:600 11px "Segoe UI",system-ui,sans-serif;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button i{font-style:normal;font-size:19px}
nav button.on{color:var(--navy);box-shadow:inset 0 3px 0 var(--gold)}
:root[data-theme="dark"] nav button.on{color:var(--gold)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) nav button.on{color:var(--gold)}}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h2{font-size:22px;margin:0 0 2px}h3{font-size:16px;margin:20px 0 10px}
.sub{color:var(--mut);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
.hero{background:var(--navy);color:#fff;border:0}
.hero .sub{color:#CFDDEA}
.stats{display:flex;gap:10px;margin-bottom:6px}.stats .card{flex:1;margin:0;text-align:left}
.stats b{display:block;font-size:26px;color:var(--navy)}
:root[data-theme="dark"] .stats b{color:var(--gold)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .stats b{color:var(--gold)}}
.stats span{color:var(--mut);font-size:12px}
.row{display:flex;align-items:flex-start;gap:10px;justify-content:space-between}
.row>div{min-width:0}
.t{font-weight:600}.m{color:var(--mut);font-size:13px}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--chip);color:var(--chipt);white-space:nowrap}
.badge.g{background:var(--gold);color:#3a2a00}.badge.ok{background:#DDF3E7;color:#146B3E}
.btn{border:0;border-radius:12px;padding:9px 14px;font:600 14px "Segoe UI",system-ui,sans-serif;background:var(--navy);color:#fff;cursor:pointer}
.btn.gold{background:var(--gold);color:#3a2a00}.btn.out{background:none;border:1.5px solid var(--navy);color:var(--navy)}
:root[data-theme="dark"] .btn.out{border-color:var(--gold);color:var(--gold)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.out{border-color:var(--gold);color:var(--gold)}}
.btn.sm{padding:6px 11px;font-size:13px}.btn.full{width:100%}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px;flex:none}
.avs{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.bar{height:8px;border-radius:9px;background:var(--chip);overflow:hidden;margin:4px 0 12px}.bar i{display:block;height:100%;background:var(--navy)}
.bar.w i{background:var(--gold)}
:root[data-theme="dark"] .bar i{background:#5B8FC7}
input{width:100%;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
.opt{display:block;width:100%;text-align:left;margin-bottom:8px;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
.opt.sel{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
.back{background:none;border:0;color:var(--mut);font:600 14px inherit;cursor:pointer;padding:0 0 10px}
.tog{display:flex;justify-content:space-between;align-items:center}
.toast{position:absolute;left:50%;bottom:78px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:9px 16px;border-radius:99px;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.3);pointer-events:none}
.wrap{position:relative;display:flex;flex-direction:column;flex:1;min-height:0}
</style>
</head>
<body>
<div class="phone">
 <header><h1 id="ttl">Inicio</h1><button id="theme" aria-label="Cambiar tema">◐</button></header>
 <div class="wrap"><main id="v"></main><div id="toast"></div></div>
 <nav id="nav"></nav>
</div>
<script>
const $=s=>document.querySelector(s);
const COL=['#0B2A4A','#2E5B8A','#C98F00','#5B6B85','#0F3A63','#1E8A52'];
const ini=n=>n.split(' ').map(x=>x[0]).slice(0,2).join('');
const av=n=>`<span class="av" style="background:${COL[n.length%6]}">${ini(n)}</span>`;
const ME='Javiera Acuña';
const groups=[
 {id:'g1',n:'Reading Warriors',l:'B1',d:'Practicamos skimming, scanning y lectura académica para los tests semanales.',m:[ME,'Sebastián Navarro','Camila Reyes','Matías Soto'],code:'DUOC-4821'},
 {id:'g2',n:'Writing Lab',l:'B1',d:'Revisamos párrafos y emails en inglés entre todos. Feedback honesto y amable.',m:['Eduardo Guzmán',ME,'Camila Reyes'],code:'DUOC-7305'},
 {id:'g3',n:'Basic Talk A2',l:'A2',d:'Vocabulario cotidiano y gramática básica, sin presión.',m:['Victoria Roa',ME,'Tomás Vera'],code:'DUOC-1190'},
 {id:'g4',n:'Advanced Debaters',l:'B2',d:'Lectura de papers y debates semanales en inglés.',m:['Fernanda Lagos','Daniela Mora','Sebastián Navarro'],code:'DUOC-6642'},
 {id:'g5',n:'Tech English Crew',l:'B1',d:'Inglés técnico para TI: documentación y entrevistas.',m:['Matías Soto','Eduardo Guzmán'],code:'DUOC-9057'}];
const mine=new Set(['g1','g2','g3']);
const meets=[
 {id:'m1',g:'g1',t:'Repaso Skimming & Scanning antes del test',w:'Mañana · 18:00',loc:'Biblioteca, Sede San Joaquín – Sala 2',r:null},
 {id:'m2',g:'g2',t:'Peer review: emails formales en inglés',w:'Jueves · 19:30',loc:'Online · Google Meet',r:null},
 {id:'m3',g:'g3',t:'Role-play: pedir comida y direcciones',w:'Sábado · 17:00',loc:'Sala 204, Sede San Joaquín',r:'yes'},
 {id:'m4',g:'g1',t:'Simulacro de Academic Reading',w:'Próx. semana · 18:30',loc:'Online · Zoom',r:'yes'},
 {id:'m5',g:'g4',t:'Debate: AI in education',w:'Viernes · 18:00',loc:'Online · Zoom',r:null}];
const tests=[
 {id:'t1',t:'Everyday Vocabulary',s:'Reading',l:'A2',due:'vencido',sc:83,q:[['Choose the correct word: “I need to ___ my homework.”',['finish','finished','finishing','finishes'],0],['Opposite of “cheap”?',['Small','Expensive','Quick','Old'],1]]},
 {id:'t2',t:'Present Simple & Continuous',s:'Writing',l:'A2',due:'en 4 días',sc:null,q:[['Right now, I ___ a message to my teacher.',['write','am writing','writes','wrote'],1],['My brother ___ football on Saturdays.',['plays','is playing','play','playing'],0],['Look! It ___ outside.',['rains','rain','is raining','rained'],2]]},
 {id:'t3',t:'Skimming & Scanning',s:'Reading',l:'B1',due:'en 2 días',sc:null,q:[['Skimming a text means reading it to find...',['every detail','the main idea quickly','grammar mistakes','new words only'],1],['Scanning is best when you need to...',['find a specific date or name','understand the tone','memorize the text','translate'],0]]},
 {id:'t4',t:'Conditionals I',s:'Writing',l:'B1',due:'en 6 días',sc:67,q:[['If it rains, we ___ the session online.',['will move','would move','moved','move'],0]]},
 {id:'t5',t:'Connectors for Contrast',s:'Writing',l:'B2',due:'en 5 días',sc:null,q:[['The results were positive; ___, the team wants more data.',['however','because','so','and'],0],['___ the traffic, we arrived on time.',['Despite','Because','Therefore','Moreover'],0]]}];
const diag=[['Vocabulario',100,0],['Comprensión lectora',100,0],['Gramática',50,1],['Conectores',0,1]];
const S={tab:'home',sub:null,quiz:null,dark:null,toast:''};
const tabs=[['home','⌂','Inicio'],['groups','👥','Grupos'],['eval','✎','Evaluaciones'],['set','⚙','Ajustes']];
const lv=()=>new Set(groups.filter(g=>mine.has(g.id)).map(g=>g.l));
const myTests=()=>tests.filter(t=>lv().has(t.l));
const bad=(x,c='')=>`<span class="badge ${c}">${x}</span>`;
function toast(m){S.toast=m;$('#toast').innerHTML=`<div class="toast">${m}</div>`;setTimeout(()=>{$('#toast').innerHTML=''},1800)}
function respBadge(r){return r==='yes'?bad('Asistiré','ok'):r==='no'?bad('No asistiré'):bad('Sin responder','g')}
function home(){
 const pend=myTests().filter(t=>t.sc==null),up=meets.filter(m=>mine.has(m.g)).slice(0,3);
 return `<h2>Hola, Javiera</h2><p class="sub">Esto es lo que viene en tus grupos de estudio.</p>
 <div class="stats"><div class="card"><b>${mine.size}</b><span>Grupos</span></div><div class="card"><b>${pend.length}</b><span>Tests pendientes</span></div><div class="card"><b>B1</b><span>Tu nivel</span></div></div>
 <h3>Próximos encuentros</h3>${up.map(m=>`<div class="card" data-act="grp" data-id="${m.g}" style="cursor:pointer"><div class="row"><div class="t">${m.t}</div>${respBadge(m.r)}</div><div class="m">${groups.find(g=>g.id===m.g).n} · ${m.w}</div></div>`).join('')}
 <h3>Tests semanales pendientes</h3>${pend.length?pend.map(t=>`<div class="card"><div class="row"><div><div class="t">${t.t}</div>${bad(t.s)} ${bad(t.l)}</div><button class="btn sm" data-act="quiz" data-id="${t.id}">Resolver</button></div></div>`).join(''):'<div class="card m">No tienes tests pendientes. Únete a otro grupo para ver más.</div>'}`}
function groupsV(){
 if(S.sub){const g=groups.find(x=>x.id===S.sub),ms=meets.filter(m=>m.g===g.id),inn=mine.has(g.id);
  return `<button class="back" data-act="back">‹ Grupos</button><h2>${g.n}</h2><p class="sub">${g.d}</p><div class="row" style="margin-bottom:6px"><div>${bad('Nivel '+g.l)} ${bad(g.m.length+' de 6 integrantes')}</div>${bad(g.code,'g')}</div>
  <h3>Integrantes</h3><div class="card">${g.m.map(n=>`<div class="row" style="align-items:center;margin-bottom:8px">${av(n)}<div style="flex:1"><div class="t">${n}</div></div></div>`).join('')}</div>
  <h3>Encuentros</h3>${ms.length?ms.map(m=>`<div class="card"><div class="t">${m.t}</div><div class="m">${m.w} · ${m.loc}</div>${inn?`<div class="row" style="margin-top:10px;justify-content:flex-start"><button class="btn sm ${m.r==='yes'?'gold':'out'}" data-act="rsp" data-id="${m.id}" data-v="yes">Asistiré</button><button class="btn sm ${m.r==='no'?'gold':'out'}" data-act="rsp" data-id="${m.id}" data-v="no">No asistiré</button></div>`:''}</div>`).join(''):'<div class="card m">Aún no hay encuentros. Propón el primero.</div>'}
  ${inn?`<button class="btn out full" data-act="meet" data-id="${g.id}">Proponer encuentro</button><div style="height:10px"></div><button class="btn out full" data-act="leave" data-id="${g.id}">Salir del grupo</button>`:`<button class="btn full" data-act="join" data-id="${g.id}">Unirme al grupo</button>`}`}
 const card=g=>`<div class="card" data-act="grp" data-id="${g.id}" style="cursor:pointer"><div class="row"><div class="t">${g.n}</div>${bad(g.l,'g')}</div><div class="m" style="margin:4px 0">${g.d}</div><div class="avs">${g.m.slice(0,4).map(av).join('')}<span class="m" style="align-self:center">${g.m.length}/6</span></div></div>`;
 return `<h2>Grupos de estudio</h2><p class="sub">Máximo 6 integrantes por grupo, agrupados por nivel.</p>
 <div class="row" style="align-items:center;margin-bottom:6px"><input id="code" placeholder="Código de invitación (DUOC-1234)" aria-label="Código"><button class="btn" data-act="code">Unirme</button></div>
 <h3>Mis grupos</h3>${groups.filter(g=>mine.has(g.id)).map(card).join('')||'<div class="card m">Aún no estás en ningún grupo.</div>'}
 <h3>Explorar</h3>${groups.filter(g=>!mine.has(g.id)).map(card).join('')||'<div class="card m">No hay más grupos por ahora.</div>'}`}
function evalV(){
 const q=S.quiz;
 if(q&&q.done){const c=q.t.q.filter((x,i)=>q.a[i]===x[2]).length,p=Math.round(c/q.t.q.length*100);return `<h2>Resultado</h2><div class="card hero" style="text-align:center"><div class="sub">${q.t.t}</div><div style="font-size:48px;font-weight:800;color:var(--gold)">${p}</div><div class="sub">${c} de ${q.t.q.length} correctas</div></div><button class="btn full" data-act="end">Volver a evaluaciones</button>`}
 if(q){const x=q.t.q[q.i];return `<button class="back" data-act="end">‹ Salir del test</button><div class="m">${q.t.t} · pregunta ${q.i+1} de ${q.t.q.length}</div><div class="bar" style="margin-top:8px"><i style="width:${q.i/q.t.q.length*100}%"></i></div><h3 style="margin-top:6px">${x[0]}</h3>${x[1].map((o,i)=>`<button class="opt ${q.a[q.i]===i?'sel':''}" data-act="ans" data-i="${i}">${o}</button>`).join('')}`}
 return `<h2>Evaluaciones</h2><p class="sub">Solo ves los tests de los niveles de tus grupos.</p>
 <div class="card hero"><div class="t">Evaluación diagnóstica</div><div style="font-size:40px;font-weight:800;color:var(--gold);line-height:1.1">67 <span style="font-size:16px;color:#fff">· Nivel B1</span></div><div class="sub" style="margin:0">4 de 6 correctas</div></div>
 <div class="card">${diag.map(d=>`<div class="row"><span class="t">${d[0]}</span><span class="m">${d[1]}%</span></div><div class="bar ${d[2]?'w':''}"><i style="width:${d[1]}%"></i></div>`).join('')}<div class="m">Por reforzar: gramática y conectores.</div></div>
 <h3>Tests semanales</h3>${myTests().map(t=>`<div class="card"><div class="row"><div><div class="t">${t.t}</div>${bad(t.s)} ${bad(t.l)} <span class="m">${t.due}</span></div>${t.sc!=null?bad(t.sc+' %','ok'):`<button class="btn sm" data-act="quiz" data-id="${t.id}">Resolver</button>`}</div></div>`).join('')}`}
function setV(){
 return `<h2>Ajustes</h2><p class="sub">Tu cuenta y preferencias.</p>
 <div class="card"><div class="row" style="align-items:center">${av(ME)}<div><div class="t">${ME}</div><div class="m">Desarrollo de Software · Diurna</div></div></div><div class="avs">${bad('Nivel B1')} ${bad('javiera.acuna@duocuc.cl')}</div></div>
 <div class="card tog"><span class="t">Modo oscuro</span><button class="btn sm out" data-act="theme">Cambiar</button></div>
 <div class="card tog"><span class="t">Idioma</span>${bad('Español')}</div>
 <button class="btn out full" data-act="out">Cerrar sesión</button>`}
function render(){
 const f={home,groups:groupsV,eval:evalV,set:setV}[S.tab];
 $('#v').innerHTML=f();
 $('#ttl').textContent=tabs.find(t=>t[0]===S.tab)[2];
 $('#nav').innerHTML=tabs.map(t=>`<button class="${t[0]===S.tab?'on':''}" data-act="tab" data-id="${t[0]}"><i>${t[1]}</i>${t[2]}</button>`).join('');
}
function flipTheme(){
 const dk=document.documentElement.dataset.theme?document.documentElement.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;
 document.documentElement.dataset.theme=dk?'light':'dark';
}
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-act]');
 if(!b){return}
 const a=b.dataset.act,id=b.dataset.id;
 if(a==='tab'){S.tab=id;S.sub=null;S.quiz=null}
 else if(a==='grp'){S.tab='groups';S.sub=id}
 else if(a==='back'){S.sub=null}
 else if(a==='join'){mine.add(id);toast('Te uniste al grupo')}
 else if(a==='leave'){mine.delete(id);S.sub=null;toast('Saliste del grupo')}
 else if(a==='code'){const v=($('#code').value||'').trim().toUpperCase(),g=groups.find(x=>x.code===v);
  if(!g)return toast('No existe un grupo con ese código');
  if(mine.has(g.id))return toast('Ya perteneces a este grupo');
  mine.add(g.id);toast('Te uniste a '+g.n)}
 else if(a==='rsp'){meets.find(m=>m.id===id).r=b.dataset.v;toast('Asistencia actualizada')}
 else if(a==='meet'){const g=groups.find(x=>x.id===id);meets.push({id:'n'+Date.now(),g:id,t:'Sesión de estudio propuesta',w:'Por definir',loc:'Por definir',r:'yes'});toast('Encuentro propuesto')}
 else if(a==='quiz'){S.tab='eval';S.quiz={t:tests.find(t=>t.id===id),i:0,a:[],done:false}}
 else if(a==='ans'){const q=S.quiz;q.a[q.i]=+b.dataset.i;render();setTimeout(()=>{if(q.i<q.t.q.length-1)q.i++;else{q.done=true;q.t.sc=Math.round(q.t.q.filter((x,i)=>q.a[i]===x[2]).length/q.t.q.length*100)}render()},350);return}
 else if(a==='end'){S.quiz=null}
 else if(a==='theme'){flipTheme();return}
 else if(a==='out'){toast('Sesión cerrada (demostración)');return}
 render();
});
$('#theme').addEventListener('click',flipTheme);
render();
</script>
</body>
</html>
